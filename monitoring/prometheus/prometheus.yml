  - job_name: 'targeting-service'
    metrics_path: /actuator/prometheus
    scrape_interval: 15s
    scrape_timeout: 10s
    honor_labels: true
    static_configs:
      - targets: ['targeting-service:9003']
        labels:
          app: adserve
          service: targeting-service
          environment: docker
          tier: backend
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '([^:]+):\d+'
        replacement: '${1}'

  - job_name: 'ml-inference'
