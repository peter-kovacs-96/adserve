    scrape_interval: 15s
    scrape_timeout: 10s
    honor_labels: true
    static_configs:
      - targets: ['ml-inference:8081']
        labels:
          app: adserve
          service: ml-inference
          environment: docker
          tier: ml
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '([^:]+):\d+'
        replacement: '${1}'

  - job_name: 'partner-simulator'
