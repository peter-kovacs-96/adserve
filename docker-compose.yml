services:
  ad-orchestration:
    build:
      context: ./ad-orchestration
      dockerfile: Dockerfile
    image: adserve/ad-orchestration:latest
    container_name: ad-orchestration
    ports:
      - "8080:8080"
    environment:
      - SPRING_APPLICATION_NAME=ad-orchestration
      - SERVER_PORT=8080
      # gRPC clients
      - GRPC_CLIENT_USER_SERVICE_HOST=user-service
      - GRPC_CLIENT_USER_SERVICE_PORT=9090
      - GRPC_CLIENT_SEGMENT_SERVICE_HOST=segment-service
      - GRPC_CLIENT_SEGMENT_SERVICE_PORT=9091
      - GRPC_CLIENT_TARGETING_SERVICE_HOST=targeting-service
      - GRPC_CLIENT_TARGETING_SERVICE_PORT=9092
      # HTTP clients (type-safe config)
      # Rule: HTTP timeouts < StructuredTaskScope timeout (100ms for partners)
      - HTTP_CLIENT_ML_INFERENCE_BASE_URL=http://ml-inference:8081
      - HTTP_CLIENT_ML_INFERENCE_CONNECT_TIMEOUT=10ms
      - HTTP_CLIENT_ML_INFERENCE_READ_TIMEOUT=30ms
      # Partner clients - each partner has its own configuration
      # In production, these would be different external URLs
      - HTTP_CLIENT_PARTNERS_NIKE_BASE_URL=http://partner-simulator:8082/partners/nike
      - HTTP_CLIENT_PARTNERS_NIKE_CONNECT_TIMEOUT=10ms
      - HTTP_CLIENT_PARTNERS_NIKE_READ_TIMEOUT=85ms
      - HTTP_CLIENT_PARTNERS_ADIDAS_BASE_URL=http://partner-simulator:8082/partners/adidas
      - HTTP_CLIENT_PARTNERS_ADIDAS_CONNECT_TIMEOUT=10ms
      - HTTP_CLIENT_PARTNERS_ADIDAS_READ_TIMEOUT=85ms
      - HTTP_CLIENT_PARTNERS_PUMA_BASE_URL=http://partner-simulator:8082/partners/puma
      - HTTP_CLIENT_PARTNERS_PUMA_CONNECT_TIMEOUT=10ms
      - HTTP_CLIENT_PARTNERS_PUMA_READ_TIMEOUT=85ms
      - HTTP_CLIENT_PARTNERS_UNDERARMOUR_BASE_URL=http://partner-simulator:8082/partners/underarmour
      - HTTP_CLIENT_PARTNERS_UNDERARMOUR_CONNECT_TIMEOUT=10ms
      - HTTP_CLIENT_PARTNERS_UNDERARMOUR_READ_TIMEOUT=85ms
      - HTTP_CLIENT_PARTNERS_NEWBALANCE_BASE_URL=http://partner-simulator:8082/partners/newbalance
      - HTTP_CLIENT_PARTNERS_NEWBALANCE_CONNECT_TIMEOUT=10ms
      - HTTP_CLIENT_PARTNERS_NEWBALANCE_READ_TIMEOUT=85ms
      - HTTP_CLIENT_PARTNERS_ASICS_BASE_URL=http://partner-simulator:8082/partners/asics
      - HTTP_CLIENT_PARTNERS_ASICS_CONNECT_TIMEOUT=10ms
      - HTTP_CLIENT_PARTNERS_ASICS_READ_TIMEOUT=85ms
      - HTTP_CLIENT_PARTNERS_REEBOK_BASE_URL=http://partner-simulator:8082/partners/reebok
      - HTTP_CLIENT_PARTNERS_REEBOK_CONNECT_TIMEOUT=10ms
      - HTTP_CLIENT_PARTNERS_REEBOK_READ_TIMEOUT=85ms
      - HTTP_CLIENT_PARTNERS_SKECHERS_BASE_URL=http://partner-simulator:8082/partners/skechers
      - HTTP_CLIENT_PARTNERS_SKECHERS_CONNECT_TIMEOUT=10ms
      - HTTP_CLIENT_PARTNERS_SKECHERS_READ_TIMEOUT=85ms
      - HTTP_CLIENT_PARTNERS_COLUMBIA_BASE_URL=http://partner-simulator:8082/partners/columbia
      - HTTP_CLIENT_PARTNERS_COLUMBIA_CONNECT_TIMEOUT=10ms
      - HTTP_CLIENT_PARTNERS_COLUMBIA_READ_TIMEOUT=85ms
      - HTTP_CLIENT_PARTNERS_NORTHFACE_BASE_URL=http://partner-simulator:8082/partners/northface
      - HTTP_CLIENT_PARTNERS_NORTHFACE_CONNECT_TIMEOUT=10ms
      - HTTP_CLIENT_PARTNERS_NORTHFACE_READ_TIMEOUT=85ms
      # Metrics
      - METRICS_BUSINESS_ENABLED=true
      - METRICS_BOTTLENECK_ENABLED=true
      - LOGGING_LEVEL_IO_ADSERVE=INFO
    depends_on:
      user-service:
        condition: service_healthy
      segment-service:
        condition: service_healthy
      targeting-service:
        condition: service_healthy
      ml-inference:
        condition: service_healthy
      partner-simulator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - adserve-network
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 512M

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    image: adserve/user-service:latest
    container_name: user-service
    environment:
      - SPRING_APPLICATION_NAME=user-service
      - SERVER_PORT=9001
      - GRPC_SERVER_PORT=9090
      - LOGGING_LEVEL_IO_ADSERVE=INFO
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9001/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - adserve-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  segment-service:
    build:
      context: ./segment-service
      dockerfile: Dockerfile
    image: adserve/segment-service:latest
    container_name: segment-service
    environment:
      - SPRING_APPLICATION_NAME=segment-service
      - SERVER_PORT=9002
      - GRPC_SERVER_PORT=9091
      - LOGGING_LEVEL_IO_ADSERVE=INFO
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9002/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - adserve-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  targeting-service:
    build:
      context: ./targeting-service
      dockerfile: Dockerfile
    image: adserve/targeting-service:latest
    container_name: targeting-service
    environment:
      - SPRING_APPLICATION_NAME=targeting-service
      - SERVER_PORT=9003
      - GRPC_SERVER_PORT=9092
      - LOGGING_LEVEL_IO_ADSERVE=INFO
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9003/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - adserve-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  ml-inference:
    build:
      context: ./ml-inference
      dockerfile: Dockerfile
    image: adserve/ml-inference:latest
    container_name: ml-inference
    environment:
      - SPRING_APPLICATION_NAME=ml-inference
      - SERVER_PORT=8081
      - LOGGING_LEVEL_IO_ADSERVE=INFO
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - adserve-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  partner-simulator:
    build:
      context: ./partner-simulator
      dockerfile: Dockerfile
    image: adserve/partner-simulator:latest
    container_name: partner-simulator
    environment:
      - SPRING_APPLICATION_NAME=partner-simulator
      - SERVER_PORT=8082
      - LOGGING_LEVEL_IO_ADSERVE=INFO
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - adserve-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - adserve-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/overview.json
    volumes:
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - adserve-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

networks:
  adserve-network:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
