services:
  ad-orchestration:
    build:
      context: ./ad-orchestration
      dockerfile: Dockerfile
    image: adserve/ad-orchestration:latest
    container_name: ad-orchestration
    ports:
      - "8080:8080"
    environment:
      # HTTP Client - Docker hostnames override
      - HTTP_CLIENT_GROUPS_MLINFERENCE=http://ml-inference:8081
      - HTTP_CLIENT_GROUPS_NIKE=http://partner-simulator:8082/partners/nike
      - HTTP_CLIENT_GROUPS_ADIDAS=http://partner-simulator:8082/partners/adidas
      - HTTP_CLIENT_GROUPS_NORTHFACE=http://partner-simulator:8082/partners/northface

      # gRPC - Docker hostnames override
      - SPRING_GRPC_CLIENT_DEFAULT_CHANNEL_NEGOTIATION_TYPE=PLAINTEXT
      - SPRING_GRPC_CLIENT_CHANNELS_USER_SERVICE_ADDRESS=user-service:9090
      - SPRING_GRPC_CLIENT_CHANNELS_SEGMENT_SERVICE_ADDRESS=segment-service:9091
      - SPRING_GRPC_CLIENT_CHANNELS_TARGETING_SERVICE_ADDRESS=targeting-service:9092
    depends_on:
      user-service:
        condition: service_healthy
      segment-service:
        condition: service_healthy
      targeting-service:
        condition: service_healthy
      ml-inference:
        condition: service_healthy
      partner-simulator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - adserve-network
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 512M

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    image: adserve/user-service:latest
    container_name: user-service
    environment:
      - SPRING_APPLICATION_NAME=user-service
      - SERVER_PORT=9001
      - SPRING_GRPC_SERVER_PORT=9090
      - LOGGING_LEVEL_IO_ADSERVE=INFO
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9001/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 35s
    restart: unless-stopped
    networks:
      - adserve-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  segment-service:
    build:
      context: ./segment-service
      dockerfile: Dockerfile
    image: adserve/segment-service:latest
    container_name: segment-service
    environment:
      - SPRING_APPLICATION_NAME=segment-service
      - SERVER_PORT=9002
      - SPRING_GRPC_SERVER_PORT=9091
      - LOGGING_LEVEL_IO_ADSERVE=INFO
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9002/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 35s
    restart: unless-stopped
    networks:
      - adserve-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  targeting-service:
    build:
      context: ./targeting-service
      dockerfile: Dockerfile
    image: adserve/targeting-service:latest
    container_name: targeting-service
    environment:
      - SPRING_APPLICATION_NAME=targeting-service
      - SERVER_PORT=9003
      - SPRING_GRPC_SERVER_PORT=9092
      - LOGGING_LEVEL_IO_ADSERVE=INFO
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9003/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 35s
    restart: unless-stopped
    networks:
      - adserve-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  ml-inference:
    build:
      context: ./ml-inference
      dockerfile: Dockerfile
    image: adserve/ml-inference:latest
    container_name: ml-inference
    environment:
      - SPRING_APPLICATION_NAME=ml-inference
      - SERVER_PORT=8081
      - LOGGING_LEVEL_IO_ADSERVE=INFO
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - adserve-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  partner-simulator:
    build:
      context: ./partner-simulator
      dockerfile: Dockerfile
    image: adserve/partner-simulator:latest
    container_name: partner-simulator
    environment:
      - SPRING_APPLICATION_NAME=partner-simulator
      - SERVER_PORT=8082
      - LOGGING_LEVEL_IO_ADSERVE=INFO
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - adserve-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - adserve-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/adserve-dashboard.json
    volumes:
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - adserve-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

networks:
  adserve-network:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
