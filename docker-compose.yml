      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - adserve-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  partner-simulator:
    build:
      context: ./partner-simulator
      dockerfile: Dockerfile
    image: adserve/partner-simulator:latest
    container_name: partner-simulator
    environment:
      - SPRING_APPLICATION_NAME=partner-simulator
