spring.application.name=ad-orchestration
spring.threads.virtual.enabled=true
server.port=8080

# gRPC client channels
spring.grpc.client.default-channel.negotiation-type=PLAINTEXT
spring.grpc.client.channels.user-service.address=localhost:9090
spring.grpc.client.channels.segment-service.address=localhost:9091
spring.grpc.client.channels.targeting-service.address=localhost:9092

# HTTP Client Configuration
http.client.connect-timeout=50ms
http.client.read-timeout=85ms
http.client.groups.mlinference=http://localhost:8081
http.client.groups.nike=http://localhost:8082/partners/nike
http.client.groups.adidas=http://localhost:8082/partners/adidas
http.client.groups.northface=http://localhost:8082/partners/northface

# Native Resilience
resilience.retry.partners.max-retries=0
resilience.retry.partners.delay=0ms
resilience.retry.ml-inference.max-retries=0
resilience.retry.ml-inference.delay=0ms

# Management Server (separate port — isolate from business traffic)
management.server.port=8090

# Endpoint Access Control (Spring Boot 4.0 — opt-in model)
management.endpoints.access.default=none
management.endpoint.health.access=read-only
management.endpoint.info.access=read-only
management.endpoint.prometheus.access=read-only
management.endpoints.web.exposure.include=health,info,prometheus

# Disable discovery page
management.endpoints.web.discovery.enabled=false

# Health Configuration
management.endpoint.health.show-details=always
management.endpoint.health.cache.time-to-live=5s

# Health Probes (lightweight liveness/readiness on main server port)
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true

# Metrics
management.metrics.distribution.percentiles-histogram.http.server.requests=true
