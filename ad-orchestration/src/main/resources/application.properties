spring.application.name=ad-orchestration
server.port=8080

# gRPC client configuration
grpc.client.user-service.address=localhost:9090
grpc.client.segment-service.address=localhost:9091
grpc.client.targeting-service.address=localhost:9092
grpc.client.deadline-ms=10

# HTTP client configuration
http.client.ml-inference.base-url=http://localhost:8081
http.client.partner.base-url=http://localhost:8082
http.client.partner.timeout-ms=80

# Actuator endpoints
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true
