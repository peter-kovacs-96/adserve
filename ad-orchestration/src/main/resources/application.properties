spring.application.name=ad-orchestration
spring.threads.virtual.enabled=true
server.port=8080

# gRPC client configuration
grpc.client.user-service.host=localhost
grpc.client.user-service.port=9090
grpc.client.segment-service.host=localhost
grpc.client.segment-service.port=9091
grpc.client.targeting-service.host=localhost
grpc.client.targeting-service.port=9092

# HTTP clients (type-safe configuration)
# Rule: HTTP timeouts must be LESS than StructuredTaskScope timeout
# so that HTTP completes (success/failure) before scope tries to cancel

http.client.ml-inference.base-url=http://localhost:8081
http.client.ml-inference.connect-timeout=10ms
http.client.ml-inference.read-timeout=30ms

# Partner clients - each partner has its own configuration
# In production, these would be different external URLs
http.client.partners.nike.base-url=http://localhost:8082/partners/nike
http.client.partners.nike.connect-timeout=10ms
http.client.partners.nike.read-timeout=85ms

http.client.partners.adidas.base-url=http://localhost:8082/partners/adidas
http.client.partners.adidas.connect-timeout=10ms
http.client.partners.adidas.read-timeout=85ms

http.client.partners.puma.base-url=http://localhost:8082/partners/puma
http.client.partners.puma.connect-timeout=10ms
http.client.partners.puma.read-timeout=85ms

http.client.partners.underarmour.base-url=http://localhost:8082/partners/underarmour
http.client.partners.underarmour.connect-timeout=10ms
http.client.partners.underarmour.read-timeout=85ms

http.client.partners.newbalance.base-url=http://localhost:8082/partners/newbalance
http.client.partners.newbalance.connect-timeout=10ms
http.client.partners.newbalance.read-timeout=85ms

http.client.partners.asics.base-url=http://localhost:8082/partners/asics
http.client.partners.asics.connect-timeout=10ms
http.client.partners.asics.read-timeout=85ms

http.client.partners.reebok.base-url=http://localhost:8082/partners/reebok
http.client.partners.reebok.connect-timeout=10ms
http.client.partners.reebok.read-timeout=85ms

http.client.partners.skechers.base-url=http://localhost:8082/partners/skechers
http.client.partners.skechers.connect-timeout=10ms
http.client.partners.skechers.read-timeout=85ms

http.client.partners.columbia.base-url=http://localhost:8082/partners/columbia
http.client.partners.columbia.connect-timeout=10ms
http.client.partners.columbia.read-timeout=85ms

http.client.partners.northface.base-url=http://localhost:8082/partners/northface
http.client.partners.northface.connect-timeout=10ms
http.client.partners.northface.read-timeout=85ms

# Actuator endpoints
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true

# Enable histogram buckets for HTTP server requests
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.minimum-expected-value.http.server.requests=1ms
management.metrics.distribution.maximum-expected-value.http.server.requests=1s

# Resilience4j Circuit Breaker (default config applies to all partners)
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.slow-call-rate-threshold=80
resilience4j.circuitbreaker.configs.default.slow-call-duration-threshold=90ms
resilience4j.circuitbreaker.configs.default.sliding-window-type=count_based
resilience4j.circuitbreaker.configs.default.sliding-window-size=20
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=10
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.configs.default.register-health-indicator=true

# Resilience4j Circuit Breaker instances (using default config)
resilience4j.circuitbreaker.instances.nike.base-config=default
resilience4j.circuitbreaker.instances.adidas.base-config=default
resilience4j.circuitbreaker.instances.puma.base-config=default
resilience4j.circuitbreaker.instances.underarmour.base-config=default
resilience4j.circuitbreaker.instances.newbalance.base-config=default
resilience4j.circuitbreaker.instances.asics.base-config=default
resilience4j.circuitbreaker.instances.reebok.base-config=default
resilience4j.circuitbreaker.instances.skechers.base-config=default
resilience4j.circuitbreaker.instances.columbia.base-config=default
resilience4j.circuitbreaker.instances.northface.base-config=default

# Resilience4j Bulkhead (default config applies to all partners)
resilience4j.bulkhead.configs.default.max-concurrent-calls=10
resilience4j.bulkhead.configs.default.max-wait-duration=0ms

# Resilience4j Bulkhead instances (using default config)
resilience4j.bulkhead.instances.nike.base-config=default
resilience4j.bulkhead.instances.adidas.base-config=default
resilience4j.bulkhead.instances.puma.base-config=default
resilience4j.bulkhead.instances.underarmour.base-config=default
resilience4j.bulkhead.instances.newbalance.base-config=default
resilience4j.bulkhead.instances.asics.base-config=default
resilience4j.bulkhead.instances.reebok.base-config=default
resilience4j.bulkhead.instances.skechers.base-config=default
resilience4j.bulkhead.instances.columbia.base-config=default
resilience4j.bulkhead.instances.northface.base-config=default

# Resilience4j Retry (default config applies to all partners)
resilience4j.retry.configs.default.max-attempts=1
resilience4j.retry.configs.default.wait-duration=0ms
resilience4j.retry.configs.default.retry-exceptions=java.net.ConnectException,java.net.SocketTimeoutException

# Resilience4j Retry instances (using default config)
resilience4j.retry.instances.nike.base-config=default
resilience4j.retry.instances.adidas.base-config=default
resilience4j.retry.instances.puma.base-config=default
resilience4j.retry.instances.underarmour.base-config=default
resilience4j.retry.instances.newbalance.base-config=default
resilience4j.retry.instances.asics.base-config=default
resilience4j.retry.instances.reebok.base-config=default
resilience4j.retry.instances.skechers.base-config=default
resilience4j.retry.instances.columbia.base-config=default
resilience4j.retry.instances.northface.base-config=default

# Metrics
metrics.business-enabled=true
metrics.bottleneck-enabled=true
